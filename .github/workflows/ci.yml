name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - name: checkout sibling addons
        run: |
          git clone https://github.com/Booyaka101/whyhidden ../whyhidden
          git clone https://github.com/Booyaka101/clearcombattext ../clearcombattext
      - name: sim on WhyHidden
        run: node wow-addon-sim.mjs ../whyhidden
      - name: sim on ClearCombatText
        run: node wow-addon-sim.mjs ../clearcombattext
